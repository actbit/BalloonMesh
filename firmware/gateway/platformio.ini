[platformio]
default_envs = gateway

[env]
platform = espressif32@6.9.0
framework = arduino, espidf
platform_packages =
    framework-espidf@~3.40407.0
board = seeed_xiao_esp32c3
board_build.partitions = partitions.csv
monitor_speed = 115200
lib_extra_dirs = ../shared
build_flags =
    -I../shared/balloon_core/include
    -I../shared/balloon_common/include
    -DBM_GATEWAY_USE_WEBSOCKET=1
    -DBM_ROLE_GATEWAY
    -DBM_FIRMWARE_VERSION=\"0.1.0\"
    -DBM_GATEWAY_TOKEN=\"${sysenv.BM_GATEWAY_TOKEN}\"
    -DBM_GATEWAY_WIFI_SSID=\"${sysenv.BM_WIFI_SSID}\"
    -DBM_GATEWAY_WIFI_PASSWORD=\"${sysenv.BM_WIFI_PASS}\"

; Production: https:// BM_SERVER_URL, BM_TLS_CA_CERT (bm_server_ca.h) and a
; per-gateway API key in BM_GATEWAY_TOKEN.  Mesh keys come from the server.
[env:gateway]
build_flags =
    ${env.build_flags}
    -DBM_PRODUCTION_BUILD=1
    -DBM_SERVER_URL=\"https://balloon.actbit.dev\"

; Development: shared test Mesh keys, http:// allowed.  Never deploy.
[env:gateway-dev]
build_flags =
    ${env.build_flags}
    -DBM_SERVER_URL=\"${sysenv.BM_SERVER_URL}\"
    -DBM_DEV_AUTO_PROV=1
    -DBM_ALLOW_INSECURE_TRANSPORT=1
