[platformio]
default_envs = balloon

[env]
platform = espressif32@6.9.0
framework = arduino, espidf
platform_packages =
    framework-espidf@~3.40407.0
board = seeed_xiao_esp32c3
board_build.partitions = partitions.csv
monitor_speed = 115200
lib_extra_dirs = ../shared
build_flags =
    -I../shared/balloon_core/include
    -I../shared/balloon_common/include
    -DBM_ROLE_BALLOON
    -DBM_FIRMWARE_VERSION=\"0.1.0\"

[env:balloon]
build_flags =
    ${env.build_flags}
    -DBM_ENABLE_POSITIONING=1

[env:balloon-mesh-bringup]
build_flags =
    ${env.build_flags}
    -DBM_ENABLE_POSITIONING=0
    -DBM_DEV_AUTO_PROV=1
    -DBM_DEV_AUTO_PROV_RESET_NVS=1
    -DBM_DEV_UNICAST_ADDR=0x0101
